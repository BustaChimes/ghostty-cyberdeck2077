# GHOST//DECK — Linux-only settings (installed as ~/.config/ghostty/platform.conf)
#
# The app icon on Linux comes from a .desktop launcher, not the config
# (see apply-icon.sh). background-blur only takes effect on KDE/KWin.

# ---------- Keybinds ----------
# macOS uses Cmd; Ghostty's Linux defaults already use Ctrl+Shift for the
# same actions. Pinned here so they keep working even if a distro build or
# another include changes the defaults:
#   Cmd+C / Cmd+V        -> Ctrl+Shift+C / Ctrl+Shift+V
#   Cmd+T / Cmd+N        -> Ctrl+Shift+T / Ctrl+Shift+N
#   Cmd+W                -> Ctrl+Shift+W
#   Cmd+Shift+, (reload) -> Ctrl+Shift+,
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+n=new_window
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+comma=reload_config
