# GHOST//DECK — macOS-only settings (installed as ~/.config/ghostty/platform.conf)

# ---------- Font ----------
font-thicken = true

# ---------- Window ----------
macos-titlebar-style = transparent
macos-titlebar-proxy-icon = hidden

# ---------- App icon ----------
# macos-custom-icon needs an ABSOLUTE path (~ does not expand here).
# install.sh replaces the placeholder below with your real home directory.
macos-icon = custom
macos-custom-icon = __HOME__/.config/ghostty/icon.png
